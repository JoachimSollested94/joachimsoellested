<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Min dag</title>
<meta name="description" content="Din samlede daglige app: rolig morgenrutine, dagbog, vejrtrækning og smertedagbog. Alle data gemmes kun på din egen enhed.">
<meta name="theme-color" content="#fbf8f5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Min dag">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>
:root {
  --bg: #171210;
  --bg-wash-1: rgba(224, 144, 106, 0.08);
  --bg-wash-2: rgba(146, 174, 199, 0.05);
  --card: #201a15;
  --glass: rgba(30, 24, 19, 0.84);
  --card-soft: #2c231c;
  --text: #f2ece6;
  --muted: #a4948a;
  --teal: #e0906a;
  --teal-strong: #cd7a52;
  --teal-soft: rgba(224, 144, 106, 0.13);
  --sand: #92aec7;
  --sand-soft: rgba(146, 174, 199, 0.13);
  --border: rgba(242, 236, 230, 0.08);
  --border-strong: rgba(242, 236, 230, 0.15);
  --good: #63b98d;
  --bad: #d98a80;
  --btn-text: #171210;
  --glow-1: rgba(224, 144, 106, 0.5);
  --glow-2: rgba(224, 144, 106, 0.14);
  --glow-3: rgba(224, 144, 106, 0.2);
  --shadow-card: 0 1px 2px rgba(0, 0, 0, 0.18), 0 10px 30px rgba(0, 0, 0, 0.22);
  --shadow-btn: 0 3px 12px rgba(205, 122, 82, 0.18);
  --radius: 22px;
  --radius-s: 13px;
  --ease-spring: cubic-bezier(0.34, 1.4, 0.44, 1);
  --ease-out: cubic-bezier(0.22, 0.8, 0.3, 1);
}
:root[data-theme="light"] {
  --bg: #fbf8f5;
  --bg-wash-1: rgba(201, 123, 78, 0.07);
  --bg-wash-2: rgba(122, 149, 173, 0.06);
  --card: #ffffff;
  --glass: rgba(255, 255, 255, 0.88);
  --card-soft: #f4ede7;
  --text: #372e28;
  --muted: #84766b;
  --teal: #c07049;
  --teal-strong: #ad603c;
  --teal-soft: rgba(201, 123, 78, 0.11);
  --sand: #5f7f9e;
  --sand-soft: rgba(122, 149, 173, 0.13);
  --border: rgba(55, 46, 40, 0.05);
  --border-strong: rgba(55, 46, 40, 0.16);
  --good: #35845d;
  --bad: #b3564c;
  --btn-text: #ffffff;
  --glow-1: rgba(192, 112, 73, 0.35);
  --glow-2: rgba(192, 112, 73, 0.10);
  --glow-3: rgba(192, 112, 73, 0.18);
  --shadow-card: 0 1px 2px rgba(55, 46, 40, 0.05), 0 10px 28px rgba(55, 46, 40, 0.07);
  --shadow-btn: 0 3px 12px rgba(192, 112, 73, 0.15);
}
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Roboto, sans-serif;
  background: var(--bg);
  background-image:
    radial-gradient(120% 55% at 50% -6%, var(--bg-wash-1), transparent 62%),
    radial-gradient(90% 40% at 92% 104%, var(--bg-wash-2), transparent 60%);
  background-attachment: fixed;
  color: var(--text);
  min-height: 100vh; overscroll-behavior-y: none;
  transition: background-color 0.35s;
}
button { font-family: inherit; color: inherit; background: none; border: none; cursor: pointer; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
input, textarea { font-family: inherit; font-size: 16px; color: var(--text); }
:focus-visible { outline: 2px solid var(--teal); outline-offset: 2px; }

#app { max-width: 560px; margin: 0 auto; padding-bottom: calc(118px + env(safe-area-inset-bottom)); }
main { padding: 6px 18px 24px; }

/* ── indslusning: kortene glider blidt på plads ── */
@keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
main > * { animation: rise 0.4s var(--ease-out) both; }
main > *:nth-child(2) { animation-delay: 0.04s; }
main > *:nth-child(3) { animation-delay: 0.08s; }
main > *:nth-child(4) { animation-delay: 0.12s; }
main > *:nth-child(5) { animation-delay: 0.16s; }
main > *:nth-child(n+6) { animation-delay: 0.2s; }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}

/* ── topbar ── */
#topbar {
  padding: calc(24px + env(safe-area-inset-top)) 22px 12px;
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
  min-height: 58px;
}
#topbar h1 { font-size: 28px; font-weight: 800; letter-spacing: -0.6px; line-height: 1.15; }
#topbar .sub {
  font-size: 11.5px; color: var(--muted); font-weight: 700;
  text-transform: uppercase; letter-spacing: 0.12em; margin-bottom: 3px;
}
.saved-badge { font-size: 13px; font-weight: 700; color: var(--good); opacity: 0; transition: opacity 0.3s; white-space: nowrap; }
.saved-badge.show { opacity: 1; }
.datenav { display: flex; align-items: center; gap: 2px; }
.datenav button { width: 42px; height: 42px; border-radius: 13px; font-size: 20px; color: var(--teal); display: flex; align-items: center; justify-content: center; transition: background 0.15s, transform 0.12s; }
.datenav button:disabled { opacity: 0.25; }
.datenav button:active { background: var(--teal-soft); transform: scale(0.94); }
.linkbtn { color: var(--teal); font-weight: 700; font-size: 13.5px; }

/* ── kort ── */
.card {
  background: var(--card); border-radius: var(--radius); border: 1px solid var(--border);
  box-shadow: var(--shadow-card); padding: 22px; margin-bottom: 16px;
}
.card h2 { font-size: 17px; font-weight: 750; letter-spacing: -0.25px; margin-bottom: 6px; }
.card .h2row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 4px; }
.card .h2row h2 { margin-bottom: 0; }
.kicker {
  display: block; font-size: 10.5px; letter-spacing: 0.16em; font-weight: 800;
  text-transform: uppercase; color: var(--teal); opacity: 0.8; margin-bottom: 7px;
}
.card.hero {
  background: radial-gradient(150% 150% at 10% 0%, var(--teal-soft), transparent 58%), var(--card);
  border-color: var(--border-strong);
}
.card.hero h2 { font-size: 20px; letter-spacing: -0.35px; }
.soft { font-size: 13.5px; color: var(--muted); line-height: 1.55; }
.hintline { font-size: 12.5px; color: var(--muted); margin-bottom: 12px; line-height: 1.5; }

/* ── knapper ── */
.btn {
  display: block; width: 100%; padding: 15px; border-radius: 15px;
  background: var(--teal);
  color: var(--btn-text); font-size: 16px; font-weight: 700; letter-spacing: -0.1px;
  text-align: center; box-shadow: var(--shadow-btn);
  transition: transform 0.14s var(--ease-spring), box-shadow 0.2s, opacity 0.15s;
}
.btn:active { transform: scale(0.975); box-shadow: none; }
.btn.ghost { background: var(--teal-soft); color: var(--teal); box-shadow: none; }
.btn.sandy { background: var(--sand-soft); color: var(--sand); box-shadow: none; }
.btn.small { display: inline-block; width: auto; padding: 9px 15px; font-size: 14px; border-radius: 12px; }
.btn.quiet { background: none; color: var(--muted); font-weight: 650; font-size: 14.5px; box-shadow: none; }
.btnrow { display: flex; gap: 10px; }
.btnrow .btn { flex: 1; }

/* ── sammenklappelige sektioner ── */
details.card { padding: 0; overflow: hidden; }
details.card > summary {
  list-style: none; cursor: pointer; padding: 17px 20px;
  display: flex; align-items: center; justify-content: space-between;
  font-size: 15px; font-weight: 700; -webkit-tap-highlight-color: transparent;
  transition: background 0.15s;
}
details.card > summary:active { background: var(--teal-soft); }
details.card > summary::-webkit-details-marker { display: none; }
details.card > summary .chev { color: var(--muted); transition: transform 0.25s var(--ease-out); font-size: 12px; }
.evsum { margin-left: auto; margin-right: 10px; font-size: 13px; font-weight: 750; color: var(--muted); font-variant-numeric: tabular-nums; }
details.card[open] > summary .chev { transform: rotate(90deg); }
details.card > .inner { padding: 2px 20px 20px; }

.field { margin-bottom: 18px; }
.field:last-child { margin-bottom: 0; }
.field > label { display: block; font-size: 14px; font-weight: 650; margin-bottom: 2px; }
.field .hint { font-size: 12px; color: var(--muted); margin-bottom: 8px; }

/* ── 0–10 piller ── */
.pills { display: flex; gap: 4px; }
.pills button {
  flex: 1; height: 44px; border-radius: 11px; font-size: 14.5px; font-weight: 650;
  background: var(--card-soft); color: var(--muted); border: 1px solid transparent;
  font-variant-numeric: tabular-nums;
  transition: transform 0.15s var(--ease-spring), background 0.15s, color 0.15s;
}
.pills button:active { transform: scale(0.9); }
.pills button.sel { color: #fff; font-weight: 800; transform: scale(1.06); box-shadow: 0 3px 10px rgba(0, 0, 0, 0.25); }

.tinput, textarea.tinput {
  width: 100%; padding: 12px 13px; border-radius: 12px;
  border: 1px solid var(--border); background: var(--card-soft); outline: none;
  transition: border-color 0.15s, box-shadow 0.15s;
}
.tinput:focus { border-color: var(--teal); box-shadow: 0 0 0 3px var(--teal-soft); }
textarea.tinput { resize: vertical; min-height: 60px; line-height: 1.55; }

.chips { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 8px; }
.chips button {
  font-size: 13px; padding: 7px 12px; border-radius: 999px;
  background: var(--teal-soft); color: var(--teal); font-weight: 650;
  max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  transition: transform 0.12s; border: 1px solid transparent;
}
.chips button:active { transform: scale(0.95); }

.stepper { display: flex; align-items: center; gap: 9px; }
.stepper button {
  width: 44px; height: 44px; border-radius: 13px; background: var(--card-soft);
  font-size: 22px; font-weight: 600; color: var(--teal);
  display: flex; align-items: center; justify-content: center;
  transition: transform 0.14s var(--ease-spring), background 0.15s;
}
.stepper button:active { background: var(--teal-soft); transform: scale(0.92); }
.stepper input {
  width: 76px; height: 44px; text-align: center; border-radius: 13px;
  border: 1px solid var(--border); background: var(--card-soft); outline: none;
  font-variant-numeric: tabular-nums; -moz-appearance: textfield;
}
.stepper input:focus { border-color: var(--teal); }
.stepper input::-webkit-outer-spin-button, .stepper input::-webkit-inner-spin-button { -webkit-appearance: none; }
.stepper .unit { font-size: 13px; color: var(--muted); }

.seg { display: flex; gap: 6px; flex-wrap: wrap; }
.seg button {
  flex: 1 1 auto; min-height: 42px; padding: 9px 11px; border-radius: 12px; font-size: 14px; font-weight: 650;
  background: var(--card-soft); color: var(--muted); border: 1px solid transparent;
  transition: all 0.15s;
}
.seg button.sel { background: var(--teal-soft); color: var(--teal); border-color: var(--teal); }
.seg-desc { font-size: 12.5px; color: var(--muted); margin-top: 8px; line-height: 1.5; }

/* ── aktivitetsrækker (registrering) ── */
.actrow { display: flex; align-items: center; gap: 12px; min-height: 50px; }
.actrow + .actrow { border-top: 1px solid var(--border); }
.actrow .tick {
  width: 28px; height: 28px; border-radius: 10px; border: 2px solid var(--border-strong);
  display: flex; align-items: center; justify-content: center; flex: none;
  font-size: 15px; color: transparent; background: var(--card-soft);
  transition: all 0.18s var(--ease-spring);
}
@keyframes pop { 0% { transform: scale(0.6); } 100% { transform: scale(1); } }
.actrow.done .tick { background: var(--good); border-color: var(--good); color: #fff; animation: pop 0.25s var(--ease-spring); }
.actrow .aname { flex: 1; font-size: 14.5px; font-weight: 600; padding: 13px 0; text-align: left; }
.actrow .mins { display: none; align-items: center; gap: 6px; }
.actrow.done .mins { display: flex; }
.actrow .mins input {
  width: 60px; height: 40px; text-align: center; border-radius: 11px;
  border: 1px solid var(--border); background: var(--card-soft); outline: none;
  font-variant-numeric: tabular-nums;
}
.actrow .mins span { font-size: 12.5px; color: var(--muted); }

/* ── tjekliste (rutine/aften) ── */
.chk { display: flex; align-items: center; gap: 13px; width: 100%; text-align: left; padding: 14px 2px; min-height: 52px; }
.chk + .chk { border-top: 1px solid var(--border); }
.chk .box {
  width: 28px; height: 28px; border-radius: 10px; border: 2px solid var(--border-strong);
  flex: none; display: flex; align-items: center; justify-content: center;
  color: transparent; font-size: 15px; background: var(--card-soft);
  transition: all 0.18s var(--ease-spring);
}
.chk.on .box { background: var(--teal); border-color: var(--teal); color: var(--btn-text); animation: pop 0.25s var(--ease-spring); }
.chk .txt { flex: 1; font-size: 15px; font-weight: 550; line-height: 1.35; transition: color 0.2s; }
.chk.on .txt { color: var(--muted); }
.chk .time { font-size: 13px; color: var(--sand); font-weight: 750; font-variant-numeric: tabular-nums; }

/* ── morgenflow ── */
.dots { display: flex; gap: 9px; justify-content: center; padding: 6px 0 16px; }
.dots i { width: 8px; height: 8px; border-radius: 5px; background: var(--card-soft); border: 1px solid var(--border-strong); transition: all 0.25s var(--ease-out); }
.dots i.done { background: var(--teal); border-color: var(--teal); }
.dots i.cur { background: var(--sand); border-color: var(--sand); transform: scale(1.45); box-shadow: 0 0 10px var(--sand-soft); }
.flowhead { display: flex; align-items: center; justify-content: space-between; padding: calc(14px + env(safe-area-inset-top)) 20px 0; }
.flowhead .x { font-size: 15px; color: var(--muted); font-weight: 650; padding: 8px; }
.blockcard { text-align: center; padding: 26px 20px 22px; }
.blockcard .emoji { font-size: 44px; display: block; margin-bottom: 10px; }
.blockcard h2 { font-size: 21px; letter-spacing: -0.3px; margin-bottom: 5px; }
.blockcard .lead { font-size: 14px; color: var(--muted); margin-bottom: 16px; line-height: 1.55; }
.blockcard .list { text-align: left; margin-bottom: 14px; }
.skipnote { font-size: 12.5px; color: var(--muted); margin-top: 12px; }

/* ── dagbog ── */
.prompt-title { font-size: 19.5px; font-weight: 750; letter-spacing: -0.3px; line-height: 1.35; margin-bottom: 7px; }
.prompt-hint { font-size: 13.5px; color: var(--muted); margin-bottom: 15px; line-height: 1.55; }
textarea.jrnl {
  width: 100%; min-height: 128px; padding: 15px; border-radius: 15px;
  border: 1px solid var(--border); background: var(--card-soft);
  outline: none; resize: vertical; line-height: 1.55;
  transition: border-color 0.15s, box-shadow 0.15s;
}
textarea.jrnl:focus { border-color: var(--teal); box-shadow: 0 0 0 3px var(--teal-soft); }
.support {
  margin-top: 12px; background: var(--sand-soft); border: 1px solid var(--sand);
  border-radius: 14px; padding: 14px 16px; font-size: 14px; line-height: 1.55; text-align: left;
  animation: rise 0.35s var(--ease-out);
}
.jname { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.14em; font-weight: 800; margin-bottom: 13px; }
.jitem { width: 100%; text-align: left; padding: 14px 2px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 10px; }
.jitem:last-child { border-bottom: none; }
.jitem .d { flex: 1; min-width: 0; }
.jitem .t { display: block; font-size: 14.5px; font-weight: 700; }
.jitem .s { display: block; font-size: 13px; color: var(--muted); margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.jitem .chev { color: var(--muted); }
pre.jfull { white-space: pre-wrap; font-family: inherit; font-size: 14.5px; line-height: 1.65; background: var(--card-soft); border-radius: 15px; padding: 16px; margin-bottom: 12px; }

/* ── pacer ── */
.pacer-back {
  position: fixed; inset: 0; z-index: 120; background: var(--bg);
  background-image: radial-gradient(120% 60% at 50% 0%, var(--bg-wash-1), transparent 62%);
  display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px;
  animation: rise 0.35s var(--ease-out);
}
.pacer-circle-wrap { width: 250px; height: 250px; display: flex; align-items: center; justify-content: center; margin: 28px 0; }
.pacer-circle {
  width: 224px; height: 224px; border-radius: 50%;
  background: radial-gradient(circle at 50% 40%, var(--glow-1), var(--glow-2) 70%);
  border: 1.5px solid var(--teal);
  display: flex; align-items: center; justify-content: center;
  transform: scale(0.6);
  box-shadow: 0 0 70px var(--glow-3), inset 0 0 40px var(--glow-2);
}
@keyframes ambient { 0%, 100% { transform: scale(0.6); } 50% { transform: scale(0.66); } }
.pacer-circle.idle { animation: ambient 7s ease-in-out infinite; }
.pacer-circle .core { width: 24px; height: 24px; border-radius: 12px; background: var(--sand); box-shadow: 0 0 18px var(--sand-soft); }
.pacer-phase { font-size: 27px; font-weight: 800; letter-spacing: -0.4px; min-height: 38px; }
.pacer-count { font-size: 15px; color: var(--muted); margin-top: 7px; min-height: 22px; font-variant-numeric: tabular-nums; }
.pacer-opts { display: flex; gap: 8px; margin: 16px 0 6px; flex-wrap: wrap; justify-content: center; }
.pacer-opts button { padding: 10px 16px; border-radius: 999px; background: var(--card-soft); color: var(--muted); font-weight: 650; font-size: 14px; border: 1px solid var(--border); transition: all 0.15s; }
.pacer-opts button.sel { background: var(--teal-soft); color: var(--teal); border-color: var(--teal); }
.pacer-title { font-size: 20px; font-weight: 800; letter-spacing: -0.3px; }
.pacer-sub { font-size: 13.5px; color: var(--muted); margin-top: 5px; text-align: center; line-height: 1.55; max-width: 300px; }

/* ── udvikling & indsigt ── */
.bignum { font-size: 46px; font-weight: 850; color: var(--teal); line-height: 1.05; letter-spacing: -1.5px; font-variant-numeric: tabular-nums; }
.cal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
.cal-head .m { font-size: 15px; font-weight: 750; }
.cal-head button { width: 40px; height: 40px; border-radius: 12px; font-size: 18px; color: var(--teal); transition: background 0.15s; }
.cal-head button:active { background: var(--teal-soft); }
.cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; }
.cal-grid .dow { text-align: center; font-size: 10.5px; font-weight: 800; letter-spacing: 0.06em; color: var(--muted); padding: 3px 0; text-transform: uppercase; }
.cal-cell {
  aspect-ratio: 1; border-radius: 12px; display: flex; align-items: center; justify-content: center;
  font-size: 13px; font-weight: 650; background: var(--card-soft); color: var(--muted); border: 1px solid transparent;
  position: relative; font-variant-numeric: tabular-nums; transition: transform 0.12s;
}
button.cal-cell:active { transform: scale(0.92); }
.cal-cell.blank { background: transparent; }
.cal-cell.future { opacity: 0.28; }
.cal-cell.some { background: var(--teal-soft); color: var(--teal); border-color: var(--teal); }
.cal-cell.full { background: var(--teal); color: var(--btn-text); border-color: var(--teal); }
.cal-cell.haspain { color: #fff; }
.cal-cell.today-c { outline: 2px solid var(--sand); outline-offset: 1.5px; }
.legend { display: flex; gap: 13px; font-size: 12px; color: var(--muted); margin-top: 12px; justify-content: center; flex-wrap: wrap; }
.legend i { display: inline-block; width: 9px; height: 9px; border-radius: 5px; margin-right: 5px; }
.wbar { display: flex; align-items: flex-end; gap: 8px; height: 100px; padding-top: 10px; }
.wbar .col { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 6px; height: 100%; justify-content: flex-end; }
.wbar .bar { width: 100%; max-width: 34px; border-radius: 8px 8px 4px 4px; background: linear-gradient(180deg, var(--teal), var(--teal-strong)); min-height: 3px; }
.wbar .lbl { font-size: 10px; color: var(--muted); font-variant-numeric: tabular-nums; }
.useline { display: flex; align-items: center; gap: 11px; padding: 8px 0; }
.useline .n { flex: 1; font-size: 14px; font-weight: 620; }
.useline .track { flex: 2; height: 9px; border-radius: 5px; background: var(--card-soft); overflow: hidden; }
.useline .fill { height: 100%; border-radius: 5px; background: linear-gradient(90deg, var(--teal-strong), var(--teal)); }
.useline .v { width: 32px; text-align: right; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }

.hist-item { display: flex; align-items: center; gap: 13px; padding: 13px 4px; width: 100%; text-align: left; border-bottom: 1px solid var(--border); }
.hist-item:last-child { border-bottom: none; }
.hist-item .dot { width: 12px; height: 12px; border-radius: 6px; flex: none; background: var(--card-soft); }
.hist-item .d { flex: 1; min-width: 0; }
.hist-item .d .t { display: block; font-size: 14.5px; font-weight: 650; }

function h(tag, attrs, ...children) {
  const el = document.createElement(tag);
  if (attrs) for (const [k, v] of Object.entries(attrs)) {
    if (k === 'class') el.className = v;
    else if (k === 'html') el.innerHTML = v;
    else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else if (v !== null && v !== undefined) el.setAttribute(k, v);
  }
  for (const c of children.flat()) {
    if (c === null || c === undefined || c === false) continue;
    el.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
  }
  return el;
}
function todayISO() {
  const d = new Date();

}
function addDays(iso, n) {
  const [y, m, d] = iso.split('-').map(Number);

  return dt.getFullYear() + '-' + String(dt.getMonth() + 1).padStart(2, '0') + '-' + String(dt.getDate()).padStart(2, '0');
}
function isoToDate(iso) { const [y, m, d] = iso.split('-').map(Number); return new Date(y, m - 1, d); }
const fmtLongYear = new Intl.DateTimeFormat('da-DK', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
const fmtDay = new Intl.DateTimeFormat('da-DK', { weekday: 'long', day: 'numeric', month: 'long' });
const fmtShort = new Intl.DateTimeFormat('da-DK', { day: 'numeric', month: 'short' });

function ucfirst(s) { return s.charAt(0).toUpperCase() + s.slice(1); }
function fmtNum(x, digits) {
  if (digits === undefined) digits = 1;
  return Number(x).toLocaleString('da-DK', { minimumFractionDigits: 0, maximumFractionDigits: digits });
}
function isNum(v) { return typeof v === 'number' && isFinite(v); }
function sevColor(sev) { return 'hsl(' + Math.round(145 - sev * 137) + ', 52%, 44%)'; }
function painColor(v) { return sevColor(v / 10); }
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');

}
async function copyText(text) {
  try { await navigator.clipboard.writeText(text); toast('Kopieret ✓'); }
  catch (e) {
    const ta = document.createElement('textarea');
    ta.value = text; document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); toast('Kopieret ✓'); } catch (e2) { toast('Kunne ikke kopiere'); }
    document.body.removeChild(ta);
  }
}
async function shareText(text) {
  if (navigator.share) { try { await navigator.share({ text }); } catch (e) { /* annulleret */ } }
  else copyText(text);
}
function download(filename, mime, content) {
  const blob = new Blob([content], { type: mime });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click();
  setTimeout(() => { document.body.removeChild(a); URL.revokeObjectURL(url); }, 400);
}
function csvEscape(v, sep) {
  const s = String(v);
  if (s.includes(sep) || s.includes('"') || s.includes('\n')) return '"' + s.replace(/"/g, '""') + '"';
  return s;
}

  if (!Array.isArray(painSettings.activities)) painSettings.activities = JSON.parse(JSON.stringify(PAIN_DEFAULT_SETTINGS.activities));

  try { dcDays = JSON.parse(localStorage.getItem(DC_DAYS_KEY)) || {}; } catch (e) { dcDays = {}; }
  try { dcJournal = JSON.parse(localStorage.getItem(DC_JOURNAL_KEY)) || {}; } catch (e) { dcJournal = {}; }
  let ds = {};
  try { ds = JSON.parse(localStorage.getItem(DC_SETTINGS_KEY)) || {}; } catch (e) { ds = {}; }
  dcSettings = Object.assign({}, JSON.parse(JSON.stringify(DC_DEFAULT_SETTINGS)), ds);
  if (!dcSettings.exercises || !Array.isArray(dcSettings.exercises.baekken)) dcSettings.exercises = JSON.parse(JSON.stringify(DEFAULT_EXERCISES));
  /* Fersken-paletten er lys som standard — engangsskift, man kan stadig vælge mørk. */
  if (!dcSettings.themeV3) { dcSettings.theme = 'light'; dcSettings.themeV3 = true; saveDcSettings(); }

  /* Påmindelser: flet gemte tider/til-fra ind i standardlisten pr. id, så nye
     påmindelser (fx smertedagbogen) også dukker op for eksisterende brugere. */
  const stored = Array.isArray(ds.reminders) ? ds.reminders : [];
  dcSettings.reminders = DEFAULT_REMINDERS.map(def => {
    const s = stored.find(r => r && r.id === def.id);
    const out = Object.assign({}, def);
    if (s) { if (typeof s.time === 'string' && /^\d{2}:\d{2}$/.test(s.time)) out.time = s.time; if (typeof s.enabled === 'boolean') out.enabled = s.enabled; }
    else if (def.id === 'smertedagbog' && typeof painSettings.reminderTime === 'string' && /^\d{2}:\d{2}$/.test(painSettings.reminderTime)) {
      out.time = painSettings.reminderTime;   /* arv tidligere valgt tidspunkt fra smertedagbogen */
    }
    return out;
  });
}
function savePainEntries() { localStorage.setItem(PAIN_ENTRIES_KEY, JSON.stringify(painEntries)); }
function savePainSettings() { localStorage.setItem(PAIN_SETTINGS_KEY, JSON.stringify(painSettings)); }

/* ── Smertedagbog: dagsposter ── */

function pruneEntry(date) {
  const e = painEntries[date];
  if (!e) return;
  for (const k of Object.keys(e)) {
    const v = e[k];
    if (v === '' || v === null || v === undefined) delete e[k];
    else if (typeof v === 'object' && !Array.isArray(v)) {
      if (k === 'activities') {
        for (const id of Object.keys(v)) {
          const a = v[id];
          if (!a || (!a.done && !isNum(a.minutes))) delete v[id];
        }
        if (Object.keys(v).length === 0) delete e[k];
      } else {
        if (!v.done && !isNum(v.minutes)) delete e[k];
      }
    }
  }
  if (Object.keys(e).length === 0) delete painEntries[date];
}
let painSaveTimer = null;
function schedulePainSave() {
  clearTimeout(painSaveTimer);
  painSaveTimer = setTimeout(() => {
    pruneEntry(state.painDate);
    savePainEntries();
    showSaved();
  }, 350);
}
function showSaved() {
  const b = document.querySelector('.saved-badge');
  if (!b) return;
  b.classList.add('show');
  clearTimeout(showSaved._t);
  showSaved._t = setTimeout(() => b.classList.remove('show'), 1600);
}
function getPainEntry(date) { return painEntries[date] || null; }
function ensurePainEntry(date) {
  if (!painEntries[date]) painEntries[date] = {};
  return painEntries[date];
}
function setVal(key, value) {
  const e = ensurePainEntry(state.painDate);
  if (value === '' || value === null || value === undefined) delete e[key];
  else e[key] = value;
  schedulePainSave();
}
function getVal(key) {
  const e = getPainEntry(state.painDate);
  return e ? e[key] : undefined;
}
function painDates() { return Object.keys(painEntries).sort(); }
function historyValues(key, excludeDate, max) {
  const seen = new Set(); const out = [];
  const dates = painDates().reverse();
  for (const d of dates) {
    if (d === excludeDate) continue;
    const v = painEntries[d][key];
    if (typeof v === 'string' && v.trim() && !seen.has(v.trim().toLowerCase())) {
      seen.add(v.trim().toLowerCase());
      out.push(v.trim());
      if (out.length >= (max || 5)) break;
    }
  }
  return out;
}

/* ── Rutine: dagsposter & dagbog ── */

function dayRec(iso) {
  if (!dcDays[iso]) dcDays[iso] = { blocks: {}, evening: {}, progress: 0, flowDone: false, breathMin: 0 };
  return dcDays[iso];
}
function dcDayActive(rec) {
  if (!rec) return false;
  return Object.values(rec.blocks || {}).some(Boolean) || Object.values(rec.evening || {}).some(Boolean) ||
    (rec.breathMin || 0) > 0 || rec.flowDone || (rec.progress || 0) > 0;
}
function dayHasJournal(iso) {
  const j = dcJournal[iso];
  return !!(j && (j.q1 || j.q2 || j.q3 || j.q4));
}
/* En dag tæller, hvis der er sket NOGET — rutine, dagbog eller smertedagbog. */
function isDayActive(iso) { return dcDayActive(dcDays[iso]) || dayHasJournal(iso) || !!painEntries[iso]; }
function totalActiveDays() {
  const set = new Set();
  for (const d of Object.keys(dcDays)) if (dcDayActive(dcDays[d])) set.add(d);
  for (const d of Object.keys(dcJournal)) if (dayHasJournal(d)) set.add(d);
  for (const d of Object.keys(painEntries)) set.add(d);
  return set.size;
}

}

function compiledJournal(iso) {
  const j = dcJournal[iso] || {};
  const L = ['Regulér & Beløn — ' + fmtLongYear.format(isoToDate(iso)), ''];
  JOURNAL_PROMPTS.forEach((p, i) => {

    L.push(a ? a : (p.optional ? 'Sprunget over — helt okay.' : '—'));

}
function crisisCheck(iso) {
  const j = dcJournal[iso] || {};
  const all = [j.q1, j.q2, j.q3, j.q4].join(' ').toLowerCase();
  return CRISIS_PHRASES.some(p => all.includes(p));

/* ════════════════════════ Vejrtræknings-pacer ════════════════════════ */

const pacer = { running: false, timer: null, minutes: 2, hold: false };

function openPacer(minutes) {
  pacer.minutes = minutes || 2;
  pacer.hold = false;
  renderPacer('idle');
}
function closePacer() {
  stopPacer();
  document.getElementById('pacer-root').innerHTML = '';
}
function stopPacer() {
  pacer.running = false;
  if (pacer.timer) { clearInterval(pacer.timer); pacer.timer = null; }
}
function renderPacer(mode) {
  const root = document.getElementById('pacer-root');
  root.innerHTML = '';
  const circle = h('div', { class: 'pacer-circle' + (mode === 'idle' ? ' idle' : '') }, h('div', { class: 'core' }));
  const phaseEl = h('div', { class: 'pacer-phase' }, mode === 'idle' ? 'Klar, når du er' : '');
  const countEl = h('div', { class: 'pacer-count' }, mode === 'idle' ? 'Ind 4 sek · ud 6 sek' : '');
  const wrap = h('div', { class: 'pacer-back' },
    h('div', { class: 'pacer-title' }, 'Rolig vejrtrækning'),
    h('div', { class: 'pacer-sub' }, 'Blød mave-vejrtrækning. Udåndingen er længst — det beroliger nervesystemet.'),
    h('div', { class: 'pacer-circle-wrap' }, circle),
    phaseEl, countEl);
  if (mode === 'idle') {
    const opts = h('div', { class: 'pacer-opts' });
    for (const m of [2, 5]) {
      opts.appendChild(h('button', { type: 'button', class: pacer.minutes === m ? 'sel' : '', onclick: () => { pacer.minutes = m; renderPacer('idle'); } }, m + ' min'));
    }
    opts.appendChild(h('button', { type: 'button', class: pacer.hold ? 'sel' : '', onclick: () => { pacer.hold = !pacer.hold; renderPacer('idle'); } }, '2 sek pause'));
    wrap.appendChild(opts);
    wrap.appendChild(h('div', { class: 'pacer-ctrl', style: 'width:100%;max-width:340px;margin-top:10px' },
      h('button', { type: 'button', class: 'btn', onclick: () => startPacer(circle, phaseEl, countEl, wrap) }, 'Begynd'),
      h('button', { type: 'button', class: 'btn quiet', style: 'margin-top:6px', onclick: closePacer }, 'Luk')));
  }
  root.appendChild(wrap);
}
function startPacer(circle, phaseEl, countEl, wrap) {
  wrap.querySelectorAll('.pacer-opts, .pacer-ctrl').forEach(x => x.remove());
  const stopWrap = h('div', { class: 'pacer-ctrl', style: 'width:100%;max-width:340px;margin-top:14px' },
    h('button', { type: 'button', class: 'btn ghost', onclick: () => finishPacer(wrap, phaseEl, countEl, circle, true) }, 'Stop'));
  wrap.appendChild(stopWrap);

  const phases = pacer.hold
    ? [{ n: 'Ind', d: 4, s: 1 }, { n: 'Hold', d: 2, s: 1 }, { n: 'Ud', d: 6, s: 0.6 }]
    : [{ n: 'Ind', d: 4, s: 1 }, { n: 'Ud', d: 6, s: 0.6 }];
  const total = pacer.minutes * 60 * 1000;
  const t0 = Date.now();
  let pi = 0, pStart = t0;
  pacer.running = true;
  circle.classList.remove('idle');
  circle.style.animation = 'none';
  circle.style.transition = 'transform 4s ease-in-out';
  circle.style.transform = 'scale(1)';
  phaseEl.textContent = 'Ind';

  pacer.timer = setInterval(() => {
    if (!pacer.running) return;
    const now = Date.now();
    const ph = phases[pi];
    if (now - pStart >= ph.d * 1000) {
      pi = (pi + 1) % phases.length;
      pStart = now;
      const np = phases[pi];
      circle.style.transition = 'transform ' + np.d + 's ease-in-out';
      circle.style.transform = 'scale(' + np.s + ')';
      phaseEl.textContent = np.n;
    }
    const phLeft = Math.max(0, Math.ceil((phases[pi].d * 1000 - (now - pStart)) / 1000));
    const totLeft = Math.max(0, total - (now - t0));
    const mm = Math.floor(totLeft / 60000), ss = Math.floor((totLeft % 60000) / 1000);
    countEl.textContent = phaseEl.textContent + '… ' + phLeft + '  ·  ' + mm + ':' + String(ss).padStart(2, '0') + ' tilbage';
    if (totLeft <= 0) finishPacer(wrap, phaseEl, countEl, circle, false);
  }, 200);
}
function finishPacer(wrap, phaseEl, countEl, circle, stopped) {
  stopPacer();
  if (!stopped) {
    const rec = dayRec(todayISO());
    rec.breathMin = (rec.breathMin || 0) + pacer.minutes;
    saveDcDays();
  }
  phaseEl.textContent = stopped ? 'Fint — det du nåede, tæller' : 'Færdigt 🌿';
  countEl.textContent = stopped ? '' : 'Mærk lige efter et øjeblik.';
  circle.style.transition = 'transform 3s ease-in-out';
  circle.style.transform = 'scale(0.75)';
  wrap.querySelectorAll('.pacer-ctrl').forEach(x => x.remove());
  wrap.appendChild(h('div', { class: 'pacer-ctrl', style: 'width:100%;max-width:340px;margin-top:14px' },
    h('button', { type: 'button', class: 'btn', onclick: () => { closePacer(); render(); } }, 'Luk')));
}

/* ════════════════════════ Morgenflow ════════════════════════ */

function startFlow(journalOnly) {
  const rec = dayRec(todayISO());
  if (journalOnly) state.flow = { block: 1, jstep: 0, journalOnly: true };
  else state.flow = { block: Math.min(rec.progress || 0, 4), jstep: 0, journalOnly: false };
  saveDcDays();
  render();
  window.scrollTo(0, 0);
}
function exitFlow() {
  state.flow = null;
  render();
  window.scrollTo(0, 0);
}
function advanceFlow(markDone) {
  const f = state.flow;
  const rec = dayRec(todayISO());
  const def = BLOCK_DEFS[f.block];
  if (markDone) rec.blocks[def.key] = true;
  if (f.journalOnly) { saveDcDays(); exitFlow(); return; }
  if (f.block >= 4) {
    rec.progress = 5;
    rec.flowDone = true;
    saveDcDays();
    f.block = 5;
    render(); window.scrollTo(0, 0);
    return;
  }
  f.block += 1;
  f.jstep = 0;
  rec.progress = Math.max(rec.progress || 0, f.block);
  saveDcDays();
  render(); window.scrollTo(0, 0);
}

  const main = document.getElementById('main');

  if (f.block >= 5) {

function greeting() {
  const hr = new Date().getHours();
  const name = dcSettings.name ? ', ' + dcSettings.name : '';
  if (hr < 10) return 'Godmorgen' + name;
  if (hr < 17) return 'Goddag' + name;
  return 'Godaften' + name;
}

function nextStepInfo(rec, pe) {
  const hr = new Date().getHours();
  const flowDone = !!(rec && rec.flowDone);
  const hasPain = !!(pe && Object.keys(pe).length);
  const evDone = (k) => !!(rec && rec.evening && rec.evening[k]);
  if (!flowDone && hr < 17) {
    return { text: (rec && rec.progress > 0) ? 'Fortsæt morgenrutinen, når du er klar' : 'Start morgenrutinen, når du er klar', action: () => startFlow(false) };
  }
  if (!hasPain) {
    return { text: 'Udfyld dagens registrering — det tager under et minut', action: () => { state.painDate = todayISO(); state.tab = 'track'; render(); window.scrollTo(0, 0); } };
  }
  if (hr >= 17) {
    for (const it of EVENING_ITEMS) {
      if (!evDone(it.key)) return { text: 'Kl. ' + it.time + ' — ' + it.label, action: () => {
        const el = document.getElementById('evening-card');

    if (isNum(pe.sleep_hours)) bits.push(h('span', { class: 'chip' }, 'Søvn ' + fmtNum(pe.sleep_hours) + ' t'));

  } else {
    pcard.appendChild(h('p', { class: 'soft', style: 'margin-bottom:12px' }, 'Smerte, humør og søvn — under et minut, og alt er valgfrit.'));
    pcard.appendChild(h('button', { type: 'button', class: 'btn', onclick: () => { state.painDate = iso; state.tab = 'track'; render(); window.scrollTo(0, 0); } }, 'Udfyld dagens registrering'));
    if (new Date().getHours() >= 18) pcard.appendChild(h('p', { class: 'nudgeline' }, 'Måske nu? Det tager under et minut'));
  }

  /* aften — sammenklappet, så listen ikke fylder på forsiden */
  const ecard = h('details', { class: 'card', id: 'evening-card' });
  const eCount = () => EVENING_ITEMS.filter(it => dcDays[iso] && dcDays[iso].evening && dcDays[iso].evening[it.key]).length;
  const eStatus = h('span', { class: 'evsum' }, eCount() + ' af ' + EVENING_ITEMS.length);
  ecard.appendChild(h('summary', null,
    h('span', null, 'I aften'),
    eStatus,
    h('span', { class: 'chev' }, '▶')));
  const eInner = h('div', { class: 'inner' });
  eInner.appendChild(h('p', { class: 'soft', style: 'margin-bottom:4px' }, 'Blide holdepunkter — ikke pligter.'));
  for (const it of EVENING_ITEMS) {
    const on = !!(rec && rec.evening && rec.evening[it.key]);
    const row = h('button', { type: 'button', class: 'chk' + (on ? ' on' : ''), onclick: () => {
      const r = dayRec(iso);
      r.evening[it.key] = !r.evening[it.key];
      saveDcDays();
      row.classList.toggle('on', r.evening[it.key]);
      eStatus.textContent = eCount() + ' af ' + EVENING_ITEMS.length;
      if (it.key === 'conrad' && r.evening[it.key]) toast('Godnat 💛 Du mødte op for dig selv i dag — det er nok.');
    } },
      h('span', { class: 'box' }, '✓'),
      h('span', { class: 'txt' }, it.label),
      it.breath ? h('span', { class: 'btn small sandy', style: 'margin-right:6px', onclick: (ev) => { ev.preventDefault(); ev.stopPropagation(); openPacer(5); } }, '5 min ro') : null,
      h('span', { class: 'time' }, it.time));
    eInner.appendChild(row);
  }
  ecard.appendChild(eInner);

  /* dagbogsgenvej */
  let jcard = null;
  if (!dayHasJournal(iso) && !(rec && rec.flowDone)) {
    jcard = h('div', { class: 'card' },
      h('h2', null, 'Kun dagbogen?'),
      h('p', { class: 'soft', style: 'margin-bottom:12px' }, 'Du kan også bare skrive de fire linjer — det tæller.'),
      h('button', { type: 'button', class: 'btn ghost', onclick: () => startFlow(true) }, 'Skriv dagens dagbog'));
  }

  /* Rækkefølgen følger døgnet: om aftenen rykker registrering og aften-holdepunkter øverst. */
  const evening = new Date().getHours() >= 17;
  const order = evening ? [pcard, ecard, mcard, jcard] : [mcard, pcard, ecard, jcard];
  const firstCard = order.find(c => c);
  if (firstCard) firstCard.classList.add('hero');
  main.appendChild(overviewCard(rec, pe));
  for (const c of order) if (c) main.appendChild(c);
}

function copyFromYesterday(keys) {
  const y = getPainEntry(addDays(state.painDate, -1));
  if (!y) return false;
  const e = ensurePainEntry(state.painDate);
  let copied = false;
  for (const k of keys) {
    if (y[k] !== undefined && y[k] !== '') { e[k] = y[k]; copied = true; }

  if (copied) { schedulePainSave(); renderMain(); }

function scaleField(key, label, opts) {
  const cur = getVal(key);
  const wrap = h('div', { class: 'field', 'data-field': key });

  wrap.appendChild(h('div', { class: 'hint' }, opts.hint));
  const pills = h('div', { class: 'pills', role: 'group', 'aria-label': label });
  for (let v = 0; v <= 10; v++) {
    const sev = opts.dir === 'neg' ? v / 10 : (10 - v) / 10;
    const btn = h('button', {
      type: 'button',
      'aria-pressed': cur === v ? 'true' : 'false',
      onclick: () => {
        const now = getVal(key);
        const newVal = (now === v) ? undefined : v;
        setVal(key, newVal === undefined ? '' : newVal);
        for (let i = 0; i <= 10; i++) {
          const b = pills.children[i];
          const on = newVal === i;
          b.classList.toggle('sel', on);
          b.style.background = on ? sevColor(opts.dir === 'neg' ? i / 10 : (10 - i) / 10) : '';
          b.setAttribute('aria-pressed', on ? 'true' : 'false');
        }
        extraUpdate();
      }
    }, String(v));
    if (cur === v) { btn.classList.add('sel'); btn.style.background = sevColor(sev); }
    pills.appendChild(btn);
  }
  wrap.appendChild(pills);
  const extra = h('div');
  wrap.appendChild(extra);
  function extraUpdate() {
    extra.innerHTML = '';
    if (key === 'hopelessness' && isNum(getVal(key)) && getVal(key) >= 7) {
      extra.appendChild(h('div', { class: 'support-line' },
        'Husk: du behøver ikke stå alene med det — Livslinien 70 201 201 ♥'));

  }
  extraUpdate();
  return wrap;
}

function textField(key, label, opts) {
  opts = opts || {};

function numberField(key, label, opts) {
  opts = opts || {};
  const step = opts.step || 1;
  const wrap = h('div', { class: 'field', 'data-field': key });
  wrap.appendChild(h('label', null, label));
  if (opts.hint) wrap.appendChild(h('div', { class: 'hint' }, opts.hint));
  const input = h('input', { type: 'number', inputmode: 'decimal', min: '0', step: String(step) });
  const cur = getVal(key);
  input.value = isNum(cur) ? String(cur) : '';
  function commit(v) {
    if (v === '' || v === null || isNaN(Number(v)) || Number(v) < 0) { setVal(key, ''); input.value = ''; }
    else { const n = Math.round(Number(v) * 100) / 100; setVal(key, n); input.value = String(n); }
  }
  input.addEventListener('input', () => {
    const v = input.value;
    if (v === '') setVal(key, '');
    else if (!isNaN(Number(v)) && Number(v) >= 0) setVal(key, Math.round(Number(v) * 100) / 100);
  });
  const minus = h('button', { type: 'button', 'aria-label': label + ' minus', onclick: () => {
    const now = isNum(getVal(key)) ? getVal(key) : 0;
    commit(Math.max(0, now - step));
  } }, '−');
  const plus = h('button', { type: 'button', 'aria-label': label + ' plus', onclick: () => {
    const now = isNum(getVal(key)) ? getVal(key) : 0;
    commit(now + step);
  } }, '+');
  const row = h('div', { class: 'stepper' }, minus, input, plus);
  if (opts.unit) row.appendChild(h('span', { class: 'unit' }, opts.unit));
  wrap.appendChild(row);
  return wrap;
}

function enumField(key, label, options, opts) {
  opts = opts || {};
  const wrap = h('div', { class: 'field', 'data-field': key });
  wrap.appendChild(h('label', null, label));
  if (opts.hint) wrap.appendChild(h('div', { class: 'hint' }, opts.hint));
  const seg = h('div', { class: 'seg', role: 'group', 'aria-label': label });
  const desc = h('div', { class: 'seg-desc' });
  function renderDesc() {
    const cur = getVal(key);
    const opt = options.find(o => o.value === cur);
    desc.textContent = (opt && opt.desc) ? opt.desc : '';
    desc.style.display = (opt && opt.desc) ? '' : 'none';
  }
  for (const o of options) {
    const btn = h('button', {
      type: 'button',
      onclick: () => {
        const now = getVal(key);
        const newVal = now === o.value ? '' : o.value;
        setVal(key, newVal);
        for (const b of seg.children) b.classList.toggle('sel', b === btn && newVal !== '');
        renderDesc();
      }
    }, o.label);
    if (getVal(key) === o.value) btn.classList.add('sel');
    seg.appendChild(btn);
  }
  wrap.appendChild(seg);
  wrap.appendChild(desc);
  renderDesc();
  return wrap;
}

function activityRow(label, getA, setA) {
  const a = getA() || {};
  const row = h('div', { class: 'actrow' + (a.done ? ' done' : '') });
  const tick = h('button', { type: 'button', class: 'tick', 'aria-label': label, onclick: toggle }, '✓');
  const name = h('button', { type: 'button', class: 'aname', onclick: toggle }, label);
  const minInput = h('input', { type: 'number', inputmode: 'numeric', min: '0', step: '5', placeholder: '0' });
  minInput.value = isNum(a.minutes) ? String(a.minutes) : '';
  minInput.addEventListener('input', () => {
    const cur = getA() || {};
    const v = minInput.value === '' ? undefined : Math.max(0, Math.round(Number(minInput.value)));
    setA({ done: cur.done || false, minutes: v });
  });
  function toggle() {
    const cur = getA() || {};
    const nowDone = !cur.done;
    setA(nowDone || isNum(cur.minutes) ? { done: nowDone, minutes: cur.minutes } : null);
    row.classList.toggle('done', nowDone);
  }
  row.appendChild(tick);
  row.appendChild(name);
  row.appendChild(h('div', { class: 'mins' }, minInput, h('span', null, 'min')));
  return row;
}

function painSparkline() {
  const days7 = [];
  for (let i = 6; i >= 0; i--) days7.push(addDays(todayISO(), -i));
  const pain = days7.map(d => { const e = getPainEntry(d); return e && isNum(e.pain_level) ? e.pain_level : null; });
  const mood = days7.map(d => { const e = getPainEntry(d); return e && isNum(e.mood) ? e.mood : null; });
  const W = 150, H = 44;
  function pts(arr) {
    const out = [];
    arr.forEach((v, i) => { if (v !== null) out.push([6 + i * (W - 12) / 6, H - 5 - (v / 10) * (H - 10)]); });
    return out;
  }
  function path(arr) {
    const p = pts(arr);
    return p.length ? p.map((q, i) => (i ? 'L' : 'M') + q[0].toFixed(1) + ',' + q[1].toFixed(1)).join(' ') : '';
  }
  function dots(arr, color) {
    return pts(arr).map(q => '<circle cx="' + q[0].toFixed(1) + '" cy="' + q[1].toFixed(1) + '" r="2.6" fill="' + color + '"/>').join('');
  }
  if (!pain.some(v => v !== null) && !mood.some(v => v !== null)) return null;
  const holder = h('div', { html:
    '<svg width="' + W + '" height="' + H + '" viewBox="0 0 ' + W + ' ' + H + '" aria-hidden="true">' +
    '<path d="' + path(pain) + '" fill="none" stroke="#c4574e" stroke-width="2" stroke-linecap="round"/>' +
    '<path d="' + path(mood) + '" fill="none" stroke="#4a9d6e" stroke-width="2" stroke-linecap="round"/>' +
    dots(pain, '#c4574e') + dots(mood, '#4a9d6e') + '</svg>' });
  return holder.firstChild;
}

function pearson(xs, ys) {
  const n = xs.length;
  if (n < 3) return null;
  const mx = xs.reduce((a, b) => a + b, 0) / n;
  const my = ys.reduce((a, b) => a + b, 0) / n;
  let num = 0, dx2 = 0, dy2 = 0;
  for (let i = 0; i < n; i++) {
    const dx = xs[i] - mx, dy = ys[i] - my;
    num += dx * dy; dx2 += dx * dx; dy2 += dy * dy;
  }
  if (dx2 === 0 || dy2 === 0) return null;
  return num / Math.sqrt(dx2 * dy2);
}

function factorValue(f, iso, entry) {
  if (f.get) return f.get(iso, entry);
  const v = entry ? entry[f.key] : undefined;
  return isNum(v) ? v : undefined;
}

function computeInsights() {
  const dates = painDates();
  const out = { total: dates.length, trend: [], flare: null, practices: [], corr: [] };

  for (const d of dates) {
    const e = painEntries[d];
    if (isNum(e.pain_level)) out.trend.push({ date: d, v: e.pain_level });
  }

  const flareDays = dates.filter(d => isNum(painEntries[d].pain_level) && painEntries[d].pain_level >= 7);
  const calmDays = dates.filter(d => isNum(painEntries[d].pain_level) && painEntries[d].pain_level <= 3);
  if (flareDays.length >= 3 && calmDays.length >= 3) {
    const rows = [];
    for (const f of FACTORS) {
      const fv = flareDays.map(d => factorValue(f, d, painEntries[d])).filter(isNum);
      const cv = calmDays.map(d => factorValue(f, d, painEntries[d])).filter(isNum);
      if (fv.length >= 3 && cv.length >= 3) {
        const fa = fv.reduce((a, b) => a + b, 0) / fv.length;
        const ca = cv.reduce((a, b) => a + b, 0) / cv.length;
        rows.push({ label: f.label, flare: fa, calm: ca, nf: fv.length, nc: cv.length,
          score: Math.abs(fa - ca) / f.range });
      }
    }
    rows.sort((a, b) => b.score - a.score);
    out.flare = { nFlare: flareDays.length, nCalm: calmDays.length, rows: rows.slice(0, 6) };
  } else {
    out.flare = { nFlare: flareDays.length, nCalm: calmDays.length, rows: null };
  }

  /* Praksisser: fra registreringen + fra rutinedelen — næste dags smerte */
  const allDates = Array.from(new Set(painDates().concat(Object.keys(dcDays)))).sort();
  const practiceList = SPEC_PRACTICES.map(p => ({ label: p.label, did: (iso) => {
      const e = painEntries[iso]; const a = e && e[p.key];
      return !!(a && (a.done || (isNum(a.minutes) && a.minutes > 0)));
    } }))
    .concat(painSettings.activities.map(a => ({ label: a.label, did: (iso) => {
      const e = painEntries[iso]; const x = e && e.activities && e.activities[a.id];
      return !!(x && (x.done || (isNum(x.minutes) && x.minutes > 0)));
    } })))
    .concat([
      { label: 'Morgenrutine (hel)', did: (iso) => !!(dcDays[iso] && dcDays[iso].flowDone) },
      { label: 'Bækkenøvelser (rutine)', did: (iso) => !!(dcDays[iso] && dcDays[iso].blocks && dcDays[iso].blocks.baekken) },
      { label: 'Rolig vejrtrækning ≥ 5 min', did: (iso) => !!(dcDays[iso] && (dcDays[iso].breathMin || 0) >= 5) }
    ]);
  for (const p of practiceList) {
    const withP = [], withoutP = [];
    for (const d of allDates) {
      const next = getPainEntry(addDays(d, 1));
      if (!next || !isNum(next.pain_level)) continue;
      (p.did(d) ? withP : withoutP).push(next.pain_level);
    }
    if (withP.length >= 3 && withoutP.length >= 3) {
      out.practices.push({
        label: p.label,
        withAvg: withP.reduce((x, y) => x + y, 0) / withP.length, nWith: withP.length,
        withoutAvg: withoutP.reduce((x, y) => x + y, 0) / withoutP.length, nWithout: withoutP.length
      });
    }
  }
  out.practices.sort((a, b) => (a.withAvg - a.withoutAvg) - (b.withAvg - b.withoutAvg));

  for (const f of FACTORS) {
    const xs = [], ys = [];
    for (const d of dates) {
      const e = painEntries[d];
      const fv = factorValue(f, d, e);
      if (isNum(e.pain_level) && isNum(fv)) { xs.push(fv); ys.push(e.pain_level); }
    }
    if (xs.length >= 8) {
      const r = pearson(xs, ys);
      if (r !== null) out.corr.push({ label: f.label, r, n: xs.length });
    }
  }
  out.corr.sort((a, b) => Math.abs(b.r) - Math.abs(a.r));
  return out;
}

function trendChart(trend) {
  if (trend.length < 2) return null;
  const W = 320, H = 150, L = 24, R = 16, T = 8, B = 22;
  const t0 = isoToDate(trend[0].date).getTime();
  const t1 = isoToDate(trend[trend.length - 1].date).getTime();
  const span = Math.max(t1 - t0, 1);
  function x(d) { return L + (isoToDate(d).getTime() - t0) / span * (W - L - R); }
  function y(v) { return T + (1 - v / 10) * (H - T - B); }
  let g = '';
  for (const gv of [0, 5, 10]) {
    g += '<line x1="' + L + '" y1="' + y(gv) + '" x2="' + (W - R) + '" y2="' + y(gv) + '" style="stroke:var(--border)" stroke-width="1"/>' +
         '<text x="' + (L - 6) + '" y="' + (y(gv) + 4) + '" text-anchor="end" font-size="10" style="fill:var(--muted)">' + gv + '</text>';
  }
  const nTicks = Math.min(5, trend.length);
  for (let i = 0; i < nTicks; i++) {
    const idx = Math.round(i * (trend.length - 1) / Math.max(nTicks - 1, 1));
    const d = trend[idx].date;
    g += '<text x="' + x(d) + '" y="' + (H - 6) + '" text-anchor="middle" font-size="9.5" style="fill:var(--muted)">' +
      fmtShort.format(isoToDate(d)).replace('.', '') + '</text>';
  }
  const line = trend.map((p, i) => (i ? 'L' : 'M') + x(p.date).toFixed(1) + ',' + y(p.v).toFixed(1)).join(' ');
  const dots = trend.length <= 60
    ? trend.map(p => '<circle cx="' + x(p.date).toFixed(1) + '" cy="' + y(p.v).toFixed(1) + '" r="2.6" fill="' + painColor(p.v) + '"/>').join('')
    : '';
  const holder = h('div', { html:
    '<svg viewBox="0 0 ' + W + ' ' + H + '" style="width:100%;height:auto" role="img" aria-label="Smerte over tid">' +
    g + '<path d="' + line + '" fill="none" style="stroke:var(--teal)" stroke-width="2" stroke-linejoin="round"/>' + dots + '</svg>' });
  return holder.firstChild;
}

function isoWeekLabel(offsetWeeks) {
  const d = new Date();
  d.setDate(d.getDate() - offsetWeeks * 7);
  const t = new Date(d.getTime());
  t.setHours(0, 0, 0, 0);
  t.setDate(t.getDate() + 3 - ((t.getDay() + 6) % 7));
  const w1 = new Date(t.getFullYear(), 0, 4);
  const wn = 1 + Math.round(((t - w1) / 86400000 - 3 + ((w1.getDay() + 6) % 7)) / 7);
  return 'u' + wn;
}
function weekCounts(nWeeks) {
  const out = [];
  const today = todayISO();
  const dowToday = (isoToDate(today).getDay() + 6) % 7;
  const thisMonday = addDays(today, -dowToday);
  for (let w = nWeeks - 1; w >= 0; w--) {
    const monday = addDays(thisMonday, -7 * w);
    let c = 0;
    for (let i = 0; i < 7; i++) {
      const d = addDays(monday, i);
      if (d > today) break;
      if (isDayActive(d)) c++;
    }
    out.push({ monday, count: c, label: isoWeekLabel(w) });
  }
  return out;
}

function exportExcelCSV() {
  const sep = ';';
  const numDa = (v) => isNum(v) ? String(v).replace('.', ',') : '';
  const practCols = [];
  for (const p of SPEC_PRACTICES) practCols.push({ label: p.label, get: (e) => e[p.key] });
  for (const a of painSettings.activities) practCols.push({ label: a.label, get: (e) => e.activities && e.activities[a.id] });

  const header = ['Dato', 'Smerteniveau (0-10)', 'Smertens placering', 'Værst på tidspunkt', 'Varighed',
    'Smertestillende', 'Fast medicin taget', 'Anden medicin/kosttilskud',
    'Morgenmad', 'Frokost', 'Aftensmad', 'Snacks', 'Koffein (kopper)', 'Alkohol (genstande)', 'Vand (glas)'];
  for (const p of practCols) { header.push(p.label); header.push(p.label + ' (min)'); }
  header.push('Anden praksis', 'Timer siddende', 'Timer blandt mennesker', 'Social belastning (0-10)',
    'Søvn (timer)', 'Stressniveau (0-10)', 'Mave/blære',
    'Humør (0-10)', 'Motivation (0-10)', 'Energi (0-10)', 'Angst (0-10)', 'Indre spænding (0-10)',
    'Overtænkning (0-10)', 'Håbløshed (0-10)', 'Irritabilitet (0-10)', 'Vindue for tolerance',
    'Hvad hjalp', 'Andre noter',
    'Morgenrutine gennemført', 'Rolig vejrtrækning (min)');

  const lines = [header.map(x => csvEscape(x, sep)).join(sep)];
  for (const d of painDates()) {
    const e = painEntries[d];
    const enumDa = (k) => e[k] ? (ENUM_DA[k][e[k]] || e[k]) : '';
    const row = [d, numDa(e.pain_level), e.pain_location || '', enumDa('pain_worst_time'), e.pain_duration || '',
      e.pain_killers || '', enumDa('regular_meds_taken'), e.other_meds || '',
      e.breakfast || '', e.lunch || '', e.dinner || '', e.snacks || '',
      numDa(e.caffeine_cups), numDa(e.alcohol_units), numDa(e.water_glasses)];
    for (const p of practCols) {
      const a = p.get(e);
      row.push(a && a.done ? 'Ja' : '');
      row.push(a && isNum(a.minutes) ? numDa(a.minutes) : '');
    }
    const dcRec = dcDays[d];
    row.push(e.other_practice || '', numDa(e.hours_sitting), numDa(e.hours_around_people), numDa(e.social_stress),
      numDa(e.sleep_hours), numDa(e.stress_level), e.bowel_bladder_notes || '',
      numDa(e.mood), numDa(e.motivation), numDa(e.energy), numDa(e.anxiety), numDa(e.inner_tension),
      numDa(e.overthinking), numDa(e.hopelessness), numDa(e.irritability), enumDa('window_of_tolerance'),
      e.what_helped || '', e.other_notes || '',
      dcRec && dcRec.flowDone ? 'Ja' : '', dcRec && isNum(dcRec.breathMin) && dcRec.breathMin > 0 ? numDa(dcRec.breathMin) : '');
    lines.push(row.map(x => csvEscape(x, sep)).join(sep));
  }
  download('smertedagbog-' + todayISO() + '.csv', 'text/csv;charset=utf-8', '\uFEFF' + lines.join('\r\n'));
}

function exportRawCSV() {
  const sep = ',';
  const actIds = painSettings.activities.map(a => a.id);
  const header = ['date', 'pain_level', 'pain_location', 'pain_worst_time', 'pain_duration',
    'pain_killers', 'regular_meds_taken', 'other_meds',
    'breakfast', 'lunch', 'dinner', 'snacks', 'caffeine_cups', 'alcohol_units', 'water_glasses',
    'training', 'training_min', 'somatic_work', 'somatic_work_min', 'hypnosis', 'hypnosis_min'];
  for (const id of actIds) { header.push('activity_' + id); header.push('activity_' + id + '_min'); }
  header.push('other_practice', 'hours_sitting', 'hours_around_people', 'social_stress', 'sleep_hours',
    'stress_level', 'bowel_bladder_notes', 'mood', 'motivation', 'energy', 'anxiety', 'inner_tension',
    'overthinking', 'hopelessness', 'irritability', 'window_of_tolerance', 'what_helped', 'other_notes',
    'morning_flow_done', 'breath_min');
  const lines = [header.join(sep)];
  const nv = (v) => isNum(v) ? String(v) : '';
  const sv = (v) => v ? csvEscape(v, sep) : '';
  for (const d of painDates()) {
    const e = painEntries[d];
    const row = [d, nv(e.pain_level), sv(e.pain_location), e.pain_worst_time || '', sv(e.pain_duration),
      sv(e.pain_killers), e.regular_meds_taken || '', sv(e.other_meds),
      sv(e.breakfast), sv(e.lunch), sv(e.dinner), sv(e.snacks),
      nv(e.caffeine_cups), nv(e.alcohol_units), nv(e.water_glasses)];
    for (const p of SPEC_PRACTICES) {
      const a = e[p.key];
      row.push(a && a.done ? '1' : '0');
      row.push(a && isNum(a.minutes) ? String(a.minutes) : '');
    }
    for (const id of actIds) {
      const a = e.activities && e.activities[id];
      row.push(a && a.done ? '1' : '0');
      row.push(a && isNum(a.minutes) ? String(a.minutes) : '');
    }
    const dcRec = dcDays[d];
    row.push(sv(e.other_practice), nv(e.hours_sitting), nv(e.hours_around_people), nv(e.social_stress),
      nv(e.sleep_hours), nv(e.stress_level), sv(e.bowel_bladder_notes),
      nv(e.mood), nv(e.motivation), nv(e.energy), nv(e.anxiety), nv(e.inner_tension),
      nv(e.overthinking), nv(e.hopelessness), nv(e.irritability), e.window_of_tolerance || '',
      sv(e.what_helped), sv(e.other_notes),
      dcRec && dcRec.flowDone ? '1' : '0', dcRec && isNum(dcRec.breathMin) ? String(dcRec.breathMin) : '0');
    lines.push(row.join(sep));
  }
  download('smertedagbog-raw-' + todayISO() + '.csv', 'text/csv;charset=utf-8', lines.join('\n'));
}

function exportBackup() {
  const data = {
    app: 'mindag', version: 1, exported_at: new Date().toISOString(),
    smertedagbog: { entries: painEntries, settings: painSettings },
    dailycalm: { days: dcDays, journal: dcJournal, settings: dcSettings }
  };
  download('mindag-backup-' + todayISO() + '.json', 'application/json', JSON.stringify(data, null, 2));
}

function importBackup(file) {
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const data = JSON.parse(reader.result);
      if (data && data.app === 'mindag' && data.smertedagbog && data.dailycalm) {
        const n = Object.keys(data.smertedagbog.entries || {}).length;
        const m = Object.keys(data.dailycalm.journal || {}).length;
        if (!confirm('Gendan samlet sikkerhedskopi (' + n + ' registreringer, ' + m + ' dagbogsposter)?\n\nDette ERSTATTER alle nuværende data i appen.')) return;
        painEntries = data.smertedagbog.entries || {};
        if (data.smertedagbog.settings) painSettings = Object.assign({}, JSON.parse(JSON.stringify(PAIN_DEFAULT_SETTINGS)), data.smertedagbog.settings, { safetySeen: true });
        dcDays = data.dailycalm.days || {};
        dcJournal = data.dailycalm.journal || {};
        if (data.dailycalm.settings) {
          localStorage.setItem(DC_SETTINGS_KEY, JSON.stringify(Object.assign({}, data.dailycalm.settings, { introSeen: true })));
        }
        savePainEntries(); savePainSettings(); saveDcDays(); saveDcJournal();
        loadAll(); applyTheme(); render();
        toast('Gendannet ✓');
      } else if (data && data.app === 'smertedagbog' && typeof data.entries === 'object') {
        if (!confirm('Gendan smertedagbogs-sikkerhedskopi med ' + Object.keys(data.entries).length + ' dage?\n\nDette erstatter kun registreringsdelen.')) return;
        painEntries = data.entries;
        if (data.settings) painSettings = Object.assign({}, JSON.parse(JSON.stringify(PAIN_DEFAULT_SETTINGS)), data.settings, { safetySeen: true });
        savePainEntries(); savePainSettings(); render();
        toast('Gendannet ✓');
      } else if (data && data.app === 'dailycalm' && typeof data.journal === 'object') {
        if (!confirm('Gendan rutine-sikkerhedskopi (' + Object.keys(data.journal).length + ' dagbogsposter)?\n\nDette erstatter kun rutine- og dagbogsdelen.')) return;
        dcDays = data.days || {};
        dcJournal = data.journal || {};
        if (data.settings) localStorage.setItem(DC_SETTINGS_KEY, JSON.stringify(Object.assign({}, data.settings, { introSeen: true })));
        saveDcDays(); saveDcJournal();
        loadAll(); applyTheme(); render();
        toast('Gendannet ✓');
      } else {
        alert('Filen ligner ikke en sikkerhedskopi fra Min dag, Smertedagbog eller Daily Calm.');
      }
    } catch (e) {
      alert('Kunne ikke læse filen: ' + e.message);
    }
  };
  reader.readAsText(file);
}

function buildICS() {
  const active = dcSettings.reminders.filter(r => r.enabled);
  const today = todayISO().replace(/-/g, '');
  const L = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Min dag//DA', 'CALSCALE:GREGORIAN', 'METHOD:PUBLISH',
    'BEGIN:VTIMEZONE', 'TZID:Europe/Copenhagen',
    'BEGIN:DAYLIGHT', 'TZOFFSETFROM:+0100', 'TZOFFSETTO:+0200', 'TZNAME:CEST',
    'DTSTART:19700329T020000', 'RRULE:FREQ=YEARLY;BYMONTH=3;BYDAY=-1SU', 'END:DAYLIGHT',
    'BEGIN:STANDARD', 'TZOFFSETFROM:+0200', 'TZOFFSETTO:+0100', 'TZNAME:CET',
    'DTSTART:19701025T030000', 'RRULE:FREQ=YEARLY;BYMONTH=10;BYDAY=-1SU', 'END:STANDARD',
    'END:VTIMEZONE'];
  for (const r of active) {
    const hhmm = r.time.replace(':', '');
    L.push('BEGIN:VEVENT',
      'UID:mindag-' + r.id + '-' + hhmm + '@joachimsollested94.github.io',
      'DTSTAMP:' + today + 'T000000Z',
      'DTSTART;TZID=Europe/Copenhagen:' + today + 'T' + hhmm + '00',
      'DURATION:PT15M', 'RRULE:FREQ=DAILY',
      'SUMMARY:' + r.text,
      'URL:' + APP_URL,
      'BEGIN:VALARM', 'ACTION:DISPLAY', 'DESCRIPTION:' + r.text, 'TRIGGER:PT0S', 'END:VALARM',
      'END:VEVENT');
  }
  L.push('END:VCALENDAR');
  return L.join('\r\n') + '\r\n';
}

      h('b', { style: 'color:var(--sand)' }, '112'), ' ved akut fare, eller ',
      h('b', { style: 'color:var(--sand)' }, 'Livslinien 70 201 201'), '.'),
    h('p', { class: 'soft', style: 'margin-top:10px' }, 'Version ' + APP_VERSION + ' · Ingen konto, ingen sporing, alt bliver på enheden.')));
}

/* ════════════════════════ Topbar, faner & routing ════════════════════════ */

const TABS = [
  { id: 'home', label: 'I dag', icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11.5 12 4l9 7.5"/><path d="M5 10v10h14V10"/></svg>' },
  { id: 'track', label: 'Registrering', icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20.8 11.1c0-3.4-2.6-5.6-5.2-5.6-1.5 0-2.8.7-3.6 1.8-.8-1.1-2.1-1.8-3.6-1.8-2.6 0-5.2 2.2-5.2 5.6 0 4.1 4.6 7.3 8.8 10 4.2-2.7 8.8-5.9 8.8-10Z"/><path d="M5 12h3l2-3 2 5 2-3h5"/></svg>' },
  { id: 'journal', label: 'Dagbog', icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h13a3 3 0 0 1 3 3v13H7a3 3 0 0 1-3-3Z"/><path d="M4 17h16M8 8h8M8 12h5"/></svg>' },
  { id: 'growth', label: 'Udvikling', icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21c-5 -2.5 -7.5 -7 -7 -13 4 0.5 6 2 7 4 1 -2 3 -3.5 7 -4 0.5 6 -2 10.5 -7 13Z"/><path d="M12 21V12"/></svg>' },
  { id: 'settings', label: 'Mere', icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1 1.55V21a2 2 0 1 1-4 0v-.09a1.7 1.7 0 0 0-1-1.55 1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.7 1.7 0 0 0 .34-1.87 1.7 1.7 0 0 0-1.55-1H3a2 2 0 1 1 0-4h.09a1.7 1.7 0 0 0 1.55-1 1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.7 1.7 0 0 0 1.87.34h.09a1.7 1.7 0 0 0 1-1.55V3a2 2 0 1 1 4 0v.09a1.7 1.7 0 0 0 1 1.55 1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.7 1.7 0 0 0-.34 1.87v.09a1.7 1.7 0 0 0 1.55 1H21a2 2 0 1 1 0 4h-.09a1.7 1.7 0 0 0-1.55 1Z"/></svg>' }
];

function renderTopbar() {
  const bar = document.getElementById('topbar');
  if (state.flow) return;
  bar.innerHTML = '';
  if (state.tab === 'track') {
    const isToday = state.painDate === todayISO();
    bar.appendChild(h('div', null,
      h('div', { class: 'sub' }, isToday ? ucfirst(fmtDay.format(new Date())) : 'Du redigerer en tidligere dag'),
      h('h1', null, isToday ? 'Registrering' : ucfirst(fmtDay.format(isoToDate(state.painDate))))));
    const nav = h('div', { class: 'datenav' },
      h('span', { class: 'saved-badge' }, 'Gemt ✓'),
      h('button', { type: 'button', 'aria-label': 'Forrige dag', onclick: () => { state.painDate = addDays(state.painDate, -1); render(); } }, '‹'),
      h('button', { type: 'button', 'aria-label': 'Næste dag', disabled: isToday ? '' : null,
        onclick: () => { if (state.painDate < todayISO()) { state.painDate = addDays(state.painDate, 1); render(); } } }, '›'));
    if (!isToday) nav.insertBefore(h('button', { type: 'button', class: 'linkbtn', style: 'width:auto;padding:0 6px', onclick: () => {
      state.painDate = todayISO(); render();
    } }, 'I dag'), nav.children[1]);
    bar.appendChild(nav);
    return;
  }
  const titles = { home: greeting(), journal: 'Dagbog', growth: 'Din udvikling', settings: 'Indstillinger' };
  bar.appendChild(h('div', null,
    state.tab === 'home' ? h('div', { class: 'sub' }, ucfirst(fmtDay.format(new Date()))) : null,
    h('h1', null, titles[state.tab] || 'Min dag')));
}

function renderTabbar() {
  const nav = document.getElementById('tabbar');
  nav.innerHTML = '';
  for (const t of TABS) {
    const btn = h('button', { type: 'button', class: state.tab === t.id ? 'sel' : '', 'aria-label': t.label, onclick: () => {
      state.tab = t.id;
      state.viewEntry = null;
      if (t.id === 'growth') { state.monthRutine = null; state.monthKrop = null; }
      if (t.id === 'track') state.painDate = todayISO();
      render();
      window.scrollTo(0, 0);
    } });
    btn.innerHTML = t.icon;
    btn.appendChild(h('span', null, t.label));
    nav.appendChild(btn);
  }
}

function renderMain() {
  if (state.tab === 'home') renderHome();
  else if (state.tab === 'track') renderTrack();
  else if (state.tab === 'journal') renderJournalTab();
  else if (state.tab === 'growth') renderGrowth();
  else renderSettings();
}

function render() {
  document.body.classList.toggle('in-flow', !!state.flow);
  if (state.flow) { renderFlow(); return; }
  renderTopbar();
  renderTabbar();
  renderMain();
}

/* ════════════════════════ Første start ════════════════════════ */

function showIntro() {
  const root = document.getElementById('modal-root');
  root.innerHTML = '';
  root.appendChild(h('div', { class: 'modal-back' },
    h('div', { class: 'modal' },
      h('h2', null, 'Velkommen til Min dag 🌿'),
      h('p', null, 'Én rolig app til din dag: morgenrutine, dagbog, vejrtrækning og smertedagbog.'),
      h('p', null, 'Du starter altid selv, alt kan springes over, og en delvis dag tæller. Alle data bliver på din egen enhed.'),
      h('div', { class: 'safety' }, SAFETY_TEXT),
      h('button', { type: 'button', class: 'btn', style: 'margin-top:12px', onclick: () => {
        dcSettings.introSeen = true; painSettings.safetySeen = true;
        saveDcSettings(); savePainSettings();
        root.innerHTML = '';
      } }, 'Godt at vide — videre'))));
}

loadAll();
applyTheme();
window.matchMedia('(prefers-color-scheme: light)').addEventListener('change', () => { if (dcSettings.theme === 'auto') applyTheme(); });
render();
if (!dcSettings.introSeen || !painSettings.safetySeen) showIntro();

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => { /* offline-cache er en bonus */ });
  });
}
</script>
</body>
</html>
